<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center">To-Do List</h1>
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="input-group mb-3">
                    <input type="text" id="taskInput" class="form-control" placeholder="Add a new task" />
                    <div class="input-group-append">
                        <button class="btn btn-primary" id="addBtn">Add Task</button>
                    </div>
                </div>
                <ul class="list-group" id="taskList"></ul>
            </div>
        </div>
    </div>

    <script>
        const addButton = document.getElementById("addBtn");
        const taskInput = document.getElementById("taskInput");
        const taskList = document.getElementById("taskList");

        addButton.addEventListener("click", () => {
            const taskText = taskInput.value.trim();
            if (taskText !== "") {
                const listItem = document.createElement("li");
                listItem.classList.add("list-group-item", "d-flex", "justify-content-between", "align-items-center");
                listItem.innerHTML = `
                    ${taskText}
                    <button class="btn btn-info btn-sm mr-2">Edit</button>
                    <button class="btn btn-danger btn-sm">Delete</button>
                `;
                
                const editButton = listItem.querySelector(".btn-info");
                const deleteButton = listItem.querySelector(".btn-danger");

                deleteButton.addEventListener("click", () => {
                    listItem.remove();
                });

                editButton.addEventListener("click", () => {
                    taskInput.value = taskText;
                    listItem.remove();
                });

                taskList.appendChild(listItem);
                taskInput.value = "";
            }
        });

        taskInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") {
                addButton.click();
            }
        });
    </script>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
